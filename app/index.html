<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy — ADR-0002 (Zero backend: nessuna rete in uscita).
      Vieta qualunque traffico verso host esterni: la foto della ricetta e i dati letti
      restano sul dispositivo di Anna. Verificato anche da un test automatico
      (app/src/test/guardrail.test.ts, T-49) che ispeziona il bundle di build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'none';"
    />
    <title>CarePath — Prenota la tua visita</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
